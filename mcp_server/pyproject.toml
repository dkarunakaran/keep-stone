[project]
name = "keepstone-mcp"
version = "0.1.0"
description = "MCP server for KeepStone - AI-powered artifact management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Dhanoop Karunakaran" }
]
keywords = ["mcp", "keepstone", "claude", "ai", "artifacts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
keepstone-mcp = "keepstone_mcp.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keepstone_mcp"]
sources = {src = ""}

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]
